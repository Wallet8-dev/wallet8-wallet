name: wallet8_wallet
description: The Wallet8 reference wallet - credentials in, presentations out.
publish_to: "none"
version: 1.0.0

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  js: ^0.6.7
  flutter:
    sdk: flutter
  http: ^1.2.0
  web: ^1.0.0
  # The platform Flutter SDK - the BFF client, the bootstrap, the shell.
  # Dev-tree path pin (the same form bank8-ebank uses); CI pins the git tag.
  sentin8:
    path: ../../sentin8/sentin8-flutter
  # The wallet8 Flutter SDK - the wallet core (credential store model,
  # the OID4VCI/OID4VP drivers). Published as the wallet8 package.
  wallet8_flutter:
    path: ../wallet8-flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
